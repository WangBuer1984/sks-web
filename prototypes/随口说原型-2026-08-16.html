<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>随口说 · C 端原型（审查）</title>
<style>
:root{
  --paper:#f4f1e9; --ink:#8a5a2b; --ink-soft:#b07d4e;
  --charcoal:#2a2421; --sidebar:#3a2f29; --sidebar-ink:#e9ddc9;
  --line:#d9cfb8; --card:#fbf8f1; --danger:#9c3d3d; --ok:#5a7a4a; --text-muted:#6b5a45;
  --highlight-soft:rgba(176,125,78,.08);
  --white:#fff;
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  --r-card:12px; --maxw:1040px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--charcoal);font:15px/1.6 var(--sans)}
h1,h2,h3{font-family:var(--serif);color:var(--ink)}
/* 审查条 */
.review-bar{position:sticky;top:0;z-index:50;display:flex;gap:12px;align-items:center;
  height:40px;padding:0 16px;background:#231c19;color:#e9ddc9;
  border-bottom:1px dashed #8a5a2b;font-size:13px}
.review-bar .tag{font-family:var(--serif);opacity:.9}
.review-bar select{background:#231c19;color:#e9ddc9;border:1px solid #5c4636;padding:3px 6px;border-radius:4px;font-size:12px}
/* 侧栏壳 */
.app-shell{display:flex;min-height:calc(100vh - 40px)}
.sidebar{width:216px;background:var(--sidebar);color:var(--sidebar-ink);padding:18px 0;flex-shrink:0}
.sidebar .brand{font-family:var(--serif);font-size:20px;padding:0 18px 18px;border-bottom:1px solid #4a3b33}
.sidebar nav a{display:block;padding:10px 18px;color:var(--sidebar-ink);cursor:pointer}
.sidebar nav a.on{background:rgba(255,255,255,.06);border-left:3px solid var(--ink-soft)}
.main{flex:1;overflow:auto;padding:32px 40px}
.main-inner{max-width:var(--maxw);margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.btn{display:inline-block;padding:8px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;font:inherit}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn-block{display:block;width:100%;text-align:center}
/* 脉冲加载条 */
.pulse{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pulse i{display:block;height:100%;width:40%;background:var(--ink-soft);animation:pulse 1.1s infinite}
@keyframes pulse{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
/* 诚实占位 fallback */
.fallback{margin:40px auto;max-width:560px;padding:24px;border:1px dashed var(--ink-soft);border-radius:var(--r-card);background:repeating-linear-gradient(45deg,#fbf8f1 0 10px,#f4f1e9 10px 20px)}

/* ===== 对话框 ===== */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(244,241,233,.94);display:flex;align-items:center;justify-content:center}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:32px;max-width:440px;width:90%;position:relative;box-shadow:0 12px 40px rgba(42,36,33,.12)}
.modal-close{position:absolute;top:14px;right:18px;background:none;border:none;font-size:24px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:0}
.modal-close:hover{color:var(--ink)}
.modal-title{font-family:var(--serif);font-size:22px;color:var(--ink);text-align:center;margin-bottom:24px}

/* ===== 落地页 ===== */
.landing-page{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.landing-topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.landing-topbar .logo{font-family:var(--serif);font-size:24px;color:var(--ink)}
.landing-topbar nav{display:flex;gap:24px}
.landing-topbar nav a{color:var(--charcoal);text-decoration:none;font-size:14px;transition:color .2s}
.landing-topbar nav a:hover{color:var(--ink)}
.landing-hero{text-align:center;padding:90px 0 70px}
.landing-hero h1{font-size:44px;margin-bottom:18px;line-height:1.25}
.landing-hero p{font-size:17px;color:var(--text-muted);max-width:620px;margin:0 auto 32px;line-height:1.7}
.landing-section{padding:64px 0}
.landing-section h2{font-size:28px;text-align:center;margin-bottom:40px}
.steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.tech-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:800px;margin:0 auto}
.step-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:24px;text-align:center}
.step-card .step-num{font-family:var(--serif);font-size:32px;color:var(--ink-soft);margin-bottom:10px;line-height:1}
.step-card h3{font-size:16px;margin-bottom:10px;line-height:1.4}
.step-card p{font-size:14px;color:var(--text-muted);line-height:1.6}
.tech-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:24px}
.tech-card .tech-icon{font-size:22px;margin-bottom:10px;color:var(--ink-soft)}
.tech-card h3{font-size:16px;margin-bottom:10px}
.tech-card p{font-size:14px;color:var(--text-muted);line-height:1.6}
.price-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:28px 24px;text-align:center}
.price-card h3{font-size:18px;margin-bottom:12px}
.price-card .price{font-family:var(--serif);font-size:36px;color:var(--ink);margin-bottom:6px;line-height:1}
.price-card .note{font-size:13px;color:var(--text-muted);margin-top:10px;line-height:1.5}
.price-card.featured{border-color:var(--ink);box-shadow:0 4px 20px rgba(138,90,43,.15);position:relative}
.price-card.featured::before{content:'推荐';position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:2px 12px;border-radius:10px}

/* ===== 表单 ===== */
.form-group{margin-bottom:16px}
.form-input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--paper);color:var(--charcoal);outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--ink)}
.form-input:disabled{opacity:.6;cursor:not-allowed}
.form-error{color:var(--danger);font-size:13px;margin-top:6px}
.form-hint{font-size:13px;color:var(--text-muted);margin-top:6px}

/* ===== 充值档位芯片 ===== */
.tier-chips{display:flex;gap:10px;margin:16px 0}
.tier-chip{flex:1;padding:12px 10px;border:1px solid var(--line);border-radius:var(--r-card);text-align:center;background:var(--paper)}
.tier-chip .tier-name{font-size:14px;margin-bottom:4px;color:var(--charcoal)}
.tier-chip .tier-price{font-family:var(--serif);font-size:20px;color:var(--ink)}
.tier-chip.highlight{border-color:var(--ink);background:var(--card);box-shadow:0 2px 12px rgba(138,90,43,.1)}

/* ===== 工作台 ===== */
.wb-greeting{font-family:var(--serif);font-size:24px;color:var(--ink);margin-bottom:24px}
.wb-numbers{display:flex;gap:20px;margin-bottom:24px}
.wb-num-card{flex:1;text-align:center}
.wb-num-card .num{font-family:var(--serif);font-size:28px;color:var(--ink)}
.wb-num-card .label{font-size:13px;color:var(--text-muted)}
.wb-section{margin-bottom:24px}
.wb-section-title{font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.wb-empty{color:var(--text-muted);font-size:14px;padding:20px 0;text-align:center}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px}
.badge-draft{background:rgba(107,90,69,.12);color:var(--text-muted)}
.badge-published{background:rgba(90,122,74,.12);color:var(--ok)}
.badge-viral{background:rgba(156,61,61,.1);color:var(--danger)}
.wb-today-list{list-style:none;padding:0}
.wb-today-list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.wb-today-list li:last-child{border-bottom:none}
.wb-today-type{font-size:12px;color:var(--ink-soft);white-space:nowrap;min-width:32px}
.wb-today-title{font-size:14px;color:var(--charcoal)}
.wb-today-source{font-size:12px;color:var(--text-muted);margin-left:auto}
.wb-content-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.wb-content-row:last-child{border-bottom:none}
.wb-content-title{font-size:14px;color:var(--charcoal);flex:1}
.wb-content-platform{font-size:12px;color:var(--text-muted)}
.wb-review-link{font-size:12px;color:var(--ink-soft);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}

/* ===== 校准向导 ===== */
.wizard{max-width:680px;margin:60px auto;padding:0 24px}
.wizard-steps{display:flex;margin-bottom:32px;position:relative}
.wizard-steps::before{content:'';position:absolute;top:16px;left:0;right:0;height:2px;background:var(--line);z-index:0}
.wizard-step-dot{flex:1;text-align:center;position:relative;z-index:1}
.wizard-step-dot .dot{width:32px;height:32px;border-radius:50%;background:var(--line);margin:0 auto 8px;line-height:32px;font-size:14px;color:var(--text-muted);transition:all .3s}
.wizard-step-dot.active .dot{background:var(--ink);color:var(--white)}
.wizard-step-dot.done .dot{background:var(--ok);color:var(--white)}
.wizard-step-dot .label{font-size:13px;color:var(--text-muted)}
.wizard-step-dot.active .label{color:var(--ink)}
.wizard-step-dot.done .label{color:var(--ok)}
.wizard-body{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:32px}
.wizard-footer{display:flex;justify-content:space-between;margin-top:24px;gap:12px}
.profile-fields{display:flex;flex-direction:column}
.profile-field-row{display:flex;padding:10px 0;border-bottom:1px solid var(--line)}
.profile-field-row .pf-key{width:120px;flex-shrink:0;font-size:13px;color:var(--text-muted)}
.profile-field-row .pf-val{font-size:14px;color:var(--charcoal);flex:1}
.faq-check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.faq-check-item input[type=checkbox]{margin-top:3px;accent-color:var(--ink);flex-shrink:0}
.faq-check-item .faq-body{flex:1}
.faq-check-item .faq-q{font-size:14px;color:var(--charcoal);font-weight:500}
.faq-check-item .faq-a{font-size:13px;color:var(--text-muted);margin-top:4px}
.wizard-center{text-align:center;padding:40px 0}
.wizard-center h2{font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:12px}
.wizard-center p{color:var(--text-muted);margin-bottom:24px;line-height:1.7}

/* ===== 账号页签 ===== */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:24px}
.tabs a{display:inline-block;padding:10px 20px;font-size:15px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s;text-decoration:none}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}

/* ===== 确认条 ===== */
.confirm-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(156,61,61,.08);border:1px solid var(--danger);border-radius:8px;margin-bottom:16px;font-size:14px;color:var(--danger)}
.confirm-bar .confirm-msg{flex:1}
.confirm-bar .confirm-actions{display:flex;gap:8px}

/* ===== 账号页布局 ===== */
.account-layout{display:flex;gap:24px}
.account-left{flex:1;min-width:0}
.account-right{width:280px;flex-shrink:0}

/* ===== 完善度条 ===== */
.completeness-wrap{margin-bottom:20px}
.completeness-head{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:6px}
.completeness-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.completeness-bar .fill{height:100%;background:var(--ok);border-radius:4px;transition:width .3s}

/* ===== FAQ 行（列表/编辑共用） ===== */
.faq-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.faq-row .faq-body{flex:1}
.faq-row .faq-q{font-size:14px;color:var(--charcoal);font-weight:500}
.faq-row .faq-a{font-size:13px;color:var(--text-muted);margin-top:4px}
.faq-row .faq-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}
.faq-add-dashed{border:1px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--text-muted);font-size:14px;cursor:pointer;margin-top:10px;transition:border-color .2s,color .2s}
.faq-add-dashed:hover{border-color:var(--ink-soft);color:var(--ink)}

/* 账号页 phone 行 */
.phone-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.phone-row .phone-num{font-size:15px;color:var(--charcoal)}

/* ===== 选题库 ===== */
.topic-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.topic-item:last-child{border-bottom:none}
.topic-item.highlight{background:var(--highlight-soft);padding:12px;margin:0 -12px;border-radius:8px;border-bottom:none}
.topic-item.highlight+.topic-item{border-top:1px solid var(--line);margin-top:0;padding-top:12px}
.topic-title{font-size:14px;color:var(--charcoal);flex:1}
.topic-from{font-size:12px;color:var(--text-muted);white-space:nowrap}
.topic-tag-deleted{display:inline-block;padding:1px 6px;border-radius:8px;font-size:11px;background:rgba(107,90,69,.08);color:var(--text-muted);margin-left:8px}
</style>
</head>
<body>
<div class="review-bar">
  <span class="tag">原型审查 · 不会出现在正式产品里</span>
  <select id="bar-page"></select>
  <select id="bar-state"></select>
  <span>账号阶段</span>
  <select id="bar-stage"></select>
</div>
<div id="app"></div>
<script>
const STATE = { page: 'landing', state: 'default', stage: 'active' };
const REGISTRY = {};
function register(page, states, render) { REGISTRY[page] = { states, render }; }

const PAGES = [
  ['landing','落地页'],['login','登录'],['recharge','充值'],
  ['workbench','工作台'],['calibrate','校准'],
  ['account-positioning','账号 · 定位'],['account-profile','账号 · 资料'],
  ['topics','选题库'],['create','文案创作'],['analyze','对标拆解'],
  ['kb','知识库'],['review','发布复盘']
];
const STAGES = [['new','刚开通'],['calibrated','已校准没写过'],['active','使用中'],['exhausted','额度用尽']];

// 演示账号核心（定位七字段 + 资料），各页任务往 DEMO 补列表切片
const DEMO = {
  profile: {
    人设:'说真话的工厂老板，机械加工二十年', 目标人群:'30–45 岁制造业老板',
    差异化:'工厂直营、不贬同行', 转化路径:'主页留资 → 加微信 → 到店',
    口吻:'直、带点狠、不端着', 红线:'不贬同行、不报虚价', 内容支柱:'4:2:2:2（行业 / 设备 / 老板日常 / 转化）'
  },
  account: { nickname:'老李说机械', gender:'男', age:43, city:'东莞',
    industry:'机械加工', identity:'工厂老板', style:'口播出镜', weeklyGoal:'每周 3 条' },
  faq: [
    { q:'你设备为什么比别人便宜三成？', a:'工厂直营没有中间商，加上我量大议价。' },
    { q:'便宜的会不会偷工减料？', a:'材料牌号、公差我全写在合同里，到货可复检。' }
  ],
  // 充值档位（充值对话框用，与落地页价格三卡不是同一套 SKU）
  tiers: [['50 条','¥49'],['150 条','¥129'],['拆账号 1 次','10 条']],
  // 工作台切片
  numbers: { kb:24, topics:9, adopted:3 },
  todays: [
    {type:'FAQ', title:'设备为什么便宜三成', from:'定位高频问答'},
    {type:'对标', title:'某同行 TOP1：开工前先报材料牌号', from:'拆账号存下'},
    {type:'续集', title:'爆款《便宜三成》续集：到货怎么复检', from:'复盘续集'}
  ],
  recentContent: [
    {title:'便宜三成不是偷工减料', platform:'抖音', status:'已发布'},
    {title:'合同里写公差这件事', platform:'视频号', status:'未发布'},
    {title:'工厂老板的一天', platform:'抖音', status:'爆款'}
  ],
  pendingReview: [
    {title:'材料牌号怎么写进合同', platform:'抖音', link:'v.douyin.com/abc1'},
    {title:'到货复检三步', platform:'视频号', link:'channels/xyz2'}
  ],
  topics: [
    {title:'设备为什么便宜三成', from:'定位问答', tag:'原问答已删除'},
    {title:'某同行 TOP1 续：开工前先报材料牌号', from:'对标拆解'},
    {title:'爆款《便宜三成》续集：到货怎么复检', from:'复盘续集'},
    {title:'合同里写公差这件事', from:'定位问答'}
  ],
  // 保存失败态演示用户刚改的值（不回滚）
  profileFormDraft: {
    人设:'说真话的工厂老板，精密加工二十年',
    目标人群:'30–45 岁制造业老板、采购经理',
    差异化:'工厂直营、不贬同行、可小批量试单',
    转化路径:'主页留资 → 加微信 → 到店',
    口吻:'直、带点狠、不端着',
    红线:'不贬同行、不报虚价',
    内容支柱:'4:2:2:2（行业 / 设备 / 老板日常 / 转化）'
  }
};

function fallback(s){ return `<div class="fallback"><h3>尚未实现</h3><p>page=<code>${s.page}</code> state=<code>${s.state}</code></p><p>该格在后续任务接入。</p></div>`; }

// 登录后页才套侧栏壳；未登录页裸 body
const AUTHED = new Set(['workbench','account-positioning','account-profile','topics','create','analyze','kb','review']);
function sidebarHTML(s){
  const on = p => s.page===p ? ' class="on"' : '';
  return `<aside class="sidebar"><div class="brand">随口说</div><nav>
    <a${on('workbench')} onclick="setPage('workbench')">工作台</a>
    <a${on('account-positioning')} onclick="setPage('account-positioning')">账号</a>
    <a${on('topics')} onclick="setPage('topics')">选题库</a>
    <a${on('create')} onclick="setPage('create')">文案创作</a>
    <a${on('analyze')} onclick="setPage('analyze')">对标拆解</a>
    <a${on('kb')} onclick="setPage('kb')">知识库</a>
    <a${on('review')} onclick="setPage('review')">发布复盘</a>
  </nav><div style="margin-top:auto;padding:14px 18px;border-top:1px solid #4a3b33">
    <div class="card" style="background:rgba(255,255,255,.04);color:var(--sidebar-ink);padding:12px">
      <div>剩余 <b>${s.stage==='exhausted'?0:86}</b> 条</div><div style="font-size:12px;opacity:.7">本月 150 条</div>
      <button class="btn ghost" style="margin-top:8px;width:100%" onclick="STATE._rechargeFrom=STATE.page;setPage('recharge')">充值</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer" onclick="setPage('account-profile')">
      <span style="width:28px;height:28px;border-radius:50%;background:var(--ink-soft)"></span>
      <span style="font-size:13px">${DEMO.account.nickname}</span>
    </div>
    <a style="display:block;margin-top:10px;font-size:12px;opacity:.6;cursor:pointer" onclick="setPage('landing')">退出登录</a>
  </div></aside>`;
}
function shell(s, body){
  if(!AUTHED.has(s.page)) return body;            // 落地页/登录/充值不套壳
  return `<div class="app-shell">${sidebarHTML(s)}<main class="main"><div class="main-inner">${body}</div></main></div>`;
}
function render(){
  const reg = REGISTRY[STATE.page];
  const body = reg ? reg.render(STATE) : fallback(STATE);
  document.getElementById('app').innerHTML = shell(STATE, body);
  syncBar();
}
function syncBar(){
  const sp = document.getElementById('bar-page');
  sp.innerHTML = PAGES.map(([k,n])=>`<option value="${k}"${STATE.page===k?' selected':''}>${n}</option>`).join('');
  const reg = REGISTRY[STATE.page];
  const ss = document.getElementById('bar-state');
  const states = reg ? reg.states : ['default'];

// ===== 倒计时 =====
let countdownTimer = null;
let countdownValue = 60;
let calibrateTimer = null;
function clearCountdown(){ if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; } }
function clearCalibrateTimer(){ if(calibrateTimer){ clearTimeout(calibrateTimer); calibrateTimer = null; } }
function startCountdown(){
  clearCountdown();
  countdownValue = 60;
  const el = document.getElementById('countdown-text');
  if(!el) return;
  el.textContent = countdownValue + 's 后重新获取';
  countdownTimer = setInterval(() => {
    countdownValue--;
    const el2 = document.getElementById('countdown-text');
    if(!el2) { clearCountdown(); return; }
    if(countdownValue > 0){
      el2.textContent = countdownValue + 's 后重新获取';
    } else {
      el2.innerHTML = '<a href="javascript:void(0)" style="color:var(--ink);font-size:14px" onclick="event.stopPropagation();setState(\'倒计时\')">重新获取</a>';
      clearCountdown();
    }
  }, 1000);
}

// 将 stage 映射到工作台默认态
function wbDefaultForStage(stage){
  switch(stage){
    case 'new': return '刚开通引导';
    case 'calibrated': return '已校准空库';
    case 'exhausted': return '额度用尽';
    default: return '使用中';
  }
}

function setPage(p) {
  clearCountdown();
  clearCalibrateTimer();
  STATE.page = p;
  STATE._explicitState = false;
  if (p === 'workbench') {
    STATE.state = wbDefaultForStage(STATE.stage);
  } else {
    STATE.state = (REGISTRY[p]?.states || ['default'])[0];
  }
  render();
}
function setState(st) {
  clearCountdown();
  clearCalibrateTimer();
  STATE.state = st;
  STATE._explicitState = true;
  render();
}
function setStage(sg) {
  STATE.stage = sg;
  if (STATE.page === 'workbench' && !STATE._explicitState) {
    STATE.state = wbDefaultForStage(sg);
  }
  render();
}

        <div class="wizard-center">
          <p style="font-size:16px;color:var(--charcoal);margin-bottom:16px">正在分析主页…</p>
          <div class="pulse" style="max-width:300px;margin:0 auto"><i></i></div>
          <p style="font-size:13px;color:var(--text-muted);margin-top:24px">这可能需要几秒钟</p>
        </div>
      </div>`;

    case '失败':
      return `<div class="wizard">
        ${stepIndicator(4)}
        <div class="wizard-center">
          <h2>分析没成功</h2>
          <p>网络或服务暂时不可用，请稍后重试</p>
          <button class="btn" onclick="setState('进行中')">重试</button>
        </div>
      </div>`;

    case '完成确认':
      return `<div class="wizard">
        ${stepIndicator(4)}
        <div class="wizard-center">
          <div style="font-size:48px;margin-bottom:16px;color:var(--ok)">&#10003;</div>
          <h2>定位档案已保存</h2>
          <p>校准完成，接下来完善你的账号信息</p>
          <button class="btn" style="padding:10px 32px;font-size:15px" onclick="setPage('account-positioning')">去账号定位</button>
        </div>
      </div>`;

    default:
      return fallback(s);
  }
}

// ===== 账号页签头 =====
function accountTabs(active){
  return `<nav class="tabs">
    <a class="${active==='positioning'?'on':''}" onclick="setPage('account-positioning')">定位</a>
    <a class="${active==='profile'?'on':''}" onclick="setPage('account-profile')">资料</a>
  </nav>`;
}

// ===== 账号 · 定位（五态） =====
function renderPositioning(s){
  const head = accountTabs('positioning');

  // 七字段只读展示
  function profileReadonly(){
    return `<div class="profile-fields" style="margin-bottom:20px">
      ${Object.entries(DEMO.profile).map(([k,v]) =>
        `<div class="profile-field-row"><span class="pf-key">${k}</span><span class="pf-val">${v}</span></div>`
      ).join('')}
    </div>`;
  }

  // 七字段编辑态（取 draft 或原值）
  function profileEditable(useDraft){
    const src = useDraft ? DEMO.profileFormDraft : DEMO.profile;
    return `<div class="profile-fields" style="margin-bottom:20px">
      ${Object.entries(src).map(([k,v]) =>
        `<div class="profile-field-row">
          <span class="pf-key">${k}</span>
          <div class="pf-val"><input class="form-input" value="${v.replace(/"/g,'&quot;')}" style="padding:6px 10px;font-size:14px"></div>
        </div>`
      ).join('')}
    </div>`;
  }

  // FAQ 只读列表
  function faqReadonly(faqs){
    if(!faqs || faqs.length === 0){
      return `<div style="margin-top:20px">
        <h3 style="font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:12px">高频问答</h3>
        <div class="faq-add-dashed">还没有，从校准里勾选或这里加</div>
      </div>`;
    }
    return `<div style="margin-top:20px">
      <h3 style="font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:12px">高频问答</h3>
      ${faqs.map((f,i) =>
        `<div class="faq-row">
          <div class="faq-body">
            <div class="faq-q">${f.q}</div>
            <div class="faq-a">${f.a}</div>
          </div>
          <div class="faq-actions">
            <button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="setPage('topics');STATE._highlightTopic='${i}'">生成选题</button>
          </div>
        </div>`
      ).join('')}
    </div>`;
  }

  // FAQ 编辑态
  function faqEditable(faqs){
    const list = (faqs && faqs.length > 0) ? faqs : DEMO.faq;
    return `<div style="margin-top:20px">
      <h3 style="font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:12px">高频问答</h3>
      ${list.map((f,i) =>
        `<div class="faq-row">
          <div class="faq-body">
            <input class="form-input" value="${f.q.replace(/"/g,'&quot;')}" style="margin-bottom:6px;font-size:14px;padding:6px 10px">
            <input class="form-input" value="${f.a.replace(/"/g,'&quot;')}" style="font-size:13px;padding:6px 10px">
          </div>
          <div class="faq-actions">
            <button class="btn ghost" style="padding:4px 8px;font-size:12px;color:var(--danger)" onclick="var r=this.closest('.faq-row');r.parentNode.removeChild(r)">删除</button>
            <button class="btn ghost" style="padding:4px 8px;font-size:12px" onclick="var r=this.closest('.faq-row');if(r.previousElementSibling)r.parentNode.insertBefore(r,r.previousElementSibling)">↑</button>
            <button class="btn ghost" style="padding:4px 8px;font-size:12px" onclick="var r=this.closest('.faq-row');if(r.nextElementSibling)r.parentNode.insertBefore(r.nextElementSibling,r)">↓</button>
          </div>
        </div>`
      ).join('')}
      <div class="faq-add-dashed" onclick="var t=this.previousElementSibling;var div=document.createElement('div');div.className='faq-row';div.innerHTML='<div class=faq-body><input class=form-input placeholder=问题 style=margin-bottom:6px;font-size:14px;padding:6px 10px><input class=form-input placeholder=回答 style=font-size:13px;padding:6px 10px></div><div class=faq-actions><button class=\"btn ghost\" style=padding:4px 8px;font-size:12px;color:var(--danger) onclick=\"var r=this.closest(\\'.faq-row\\');r.parentNode.removeChild(r)\">删除</button><button class=\"btn ghost\" style=padding:4px 8px;font-size:12px onclick=\"var r=this.closest(\\'.faq-row\\');if(r.previousElementSibling)r.parentNode.insertBefore(r,r.previousElementSibling)\">↑</button><button class=\"btn ghost\" style=padding:4px 8px;font-size:12px onclick=\"var r=this.closest(\\'.faq-row\\');if(r.nextElementSibling)r.parentNode.insertBefore(r.nextElementSibling,r)\">↓</button></div>';this.parentNode.insertBefore(div,this)">+ 添加问答</div>
    </div>`;
  }

  switch(s.state){
    case '未校准':
      return `${head}
        <div class="card" style="text-align:center;padding:48px 24px">
          <div style="font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:12px">还没有定位档案</div>
          <p style="color:var(--text-muted);margin-bottom:24px;line-height:1.7;max-width:420px;margin-left:auto;margin-right:auto">完成校准后，AI 会根据你的定位档案生成文案，更贴合你的风格。</p>
          <button class="btn" style="padding:10px 32px;font-size:15px" onclick="setPage('calibrate')">开始校准</button>
        </div>`;

    case '档案在FAQ空':
      return `${head}
        ${profileReadonly()}
        ${faqReadonly([])}`;

    case '有FAQ':
      return `${head}
        ${profileReadonly()}
        ${faqReadonly(DEMO.faq)}
        <div style="margin-top:16px;display:flex;gap:10px">
          <button class="btn ghost" onclick="setState('保存中')">编辑</button>
        </div>`;

    case '保存中':
      return `${head}
        <div class="pulse" style="margin-bottom:16px"><i></i></div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px">保存中…</div>
        ${profileEditable(false)}
        ${faqEditable(DEMO.faq)}
        <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
          <button class="btn" onclick="setState('有FAQ')">保存</button>
          <button class="btn ghost" id="btn-cancel-pos-edit" onclick="document.getElementById('confirm-cancel-pos').style.display='flex';this.style.display='none'">取消编辑</button>
        </div>
        <div class="confirm-bar" id="confirm-cancel-pos" style="display:none">
          <span class="confirm-msg">确定要取消编辑吗？修改的内容将不会保存。</span>
          <div class="confirm-actions">
            <button class="btn danger" style="padding:4px 12px;font-size:13px" onclick="setState('有FAQ')">确认取消</button>
            <button class="btn ghost" style="padding:4px 12px;font-size:13px" onclick="document.getElementById('confirm-cancel-pos').style.display='none';document.getElementById('btn-cancel-pos-edit').style.display='inline-block'">算了</button>
          </div>
        </div>`;

    case '保存失败':
      return `${head}
        <div style="font-size:14px;color:var(--danger);margin-bottom:16px">保存失败，请重试</div>
        ${profileEditable(true)}
        ${faqEditable(DEMO.faq)}
        <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
          <button class="btn" onclick="setState('保存中')">重试</button>
          <button class="btn ghost" id="btn-cancel-pos-fail" onclick="document.getElementById('confirm-cancel-pos-fail').style.display='flex';this.style.display='none'">取消编辑</button>
        </div>
        <div class="confirm-bar" id="confirm-cancel-pos-fail" style="display:none">
          <span class="confirm-msg">确定要取消编辑吗？修改的内容将不会保存。</span>
          <div class="confirm-actions">
            <button class="btn danger" style="padding:4px 12px;font-size:13px" onclick="setState('有FAQ')">确认取消</button>
            <button class="btn ghost" style="padding:4px 12px;font-size:13px" onclick="document.getElementById('confirm-cancel-pos-fail').style.display='none';document.getElementById('btn-cancel-pos-fail').style.display='inline-block'">算了</button>
          </div>
        </div>`;

    default:
      return fallback(s);
  }
}

// ===== 账号 · 资料（八态） =====
function renderProfile(s){
  const head = accountTabs('profile');

  // 完善度：只算 5 项（昵称/行业/身份/出镜风格/每周更新目标），性别/年龄/城市不计
  const compItems = [
    {key:'昵称', val:DEMO.account.nickname},
    {key:'行业', val:DEMO.account.industry},
    {key:'身份', val:DEMO.account.identity},
    {key:'出镜风格', val:DEMO.account.style},
    {key:'每周更新目标', val:DEMO.account.weeklyGoal}
  ];
  const compFilled = compItems.filter(i => i.val && i.val.trim()).length;
  const compPct = Math.round(compFilled / compItems.length * 100);

  function completenessBar(pct){
    return `<div class="completeness-wrap">
      <div class="completeness-head">
        <span>资料完善度</span>
        <span>${pct}%（${compFilled}/${compItems.length}）</span>
      </div>
      <div class="completeness-bar"><div class="fill" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px">只算 5 项（昵称、行业、身份、出镜风格、每周更新目标），性别、年龄、城市不计入</div>
    </div>`;
  }

  function profileForm(filled){
    const a = DEMO.account;
    return `<div class="card" style="margin-bottom:20px">
      <div class="form-group">
        <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px">昵称</label>
        <input class="form-input" value="${a.nickname}" ${filled?'':'placeholder="必填"'}>
      </div>
      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1">
          <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px">性别</label>
          <select class="form-input"><option>男</option><option>女</option></select>
        </div>
        <div class="form-group" style="flex:1">
          <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px">年龄</label>
          <input class="form-input" value="${a.age}">
        </div>
      </div>
      <div class="form-group">
        <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px">城市</label>
        <input class="form-input" value="${a.city}">
      </div>
      <div class="form-group">
        <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px">行业</label>
        <input class="form-input" value="${filled ? a.industry : ''}" placeholder="${filled ? '' : '必填'}">
      </div>
      <div class="form-group">
        <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px">身份</label>
        <input class="form-input" value="${a.identity}">
      </div>
      <div class="form-group">
        <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px">出镜风格</label>
        <div style="display:flex;gap:10px;margin-top:6px">
          ${['口播出镜','不露脸','混合'].map(st =>
            `<label style="flex:1;padding:8px;border:1px solid ${st===a.style?'var(--ink)':'var(--line)'};border-radius:8px;text-align:center;font-size:14px;cursor:pointer;background:${st===a.style?'var(--card)':'var(--paper)'}">
              <input type="radio" name="style" value="${st}" ${st===a.style?'checked':''} style="display:none">${st}
            </label>`
          ).join('')}
        </div>
      </div>
      <div class="form-group">
        <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px">每周更新目标</label>
        <input class="form-input" value="${filled ? a.weeklyGoal : ''}" placeholder="${filled ? '' : '必填'}">
      </div>
    </div>`;
  }

  function phoneSection(showBindForm, bindError){
    return `<div class="card">
      <h3 style="font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:16px">手机号</h3>
      ${showBindForm ? `
        <div class="form-group">
          <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px">新手机号</label>
          <input class="form-input" placeholder="输入新手机号">
        </div>
        <div class="form-group">
          <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:4px">验证码</label>
          <div style="display:flex;gap:10px">
            <input class="form-input" placeholder="验证码" style="flex:1;${bindError?'border-color:var(--danger)':''}">
            <button class="btn ghost" style="white-space:nowrap;font-size:13px">获取验证码</button>
          </div>
          ${bindError ? '<div class="form-error">验证码错误，请重新输入</div>' : ''}
        </div>
        <button class="btn btn-block" style="margin-top:12px">确认换绑</button>
      ` : `
        <div class="phone-row">
          <span class="phone-num">138****6789</span>
          <button class="btn ghost" id="btn-rebind" onclick="document.getElementById('confirm-rebind').style.display='flex';this.style.display='none'">换绑</button>
        </div>
        <div class="confirm-bar" id="confirm-rebind" style="display:none">
          <span class="confirm-msg">换绑后原手机号将无法登录，确定继续？</span>
          <div class="confirm-actions">
            <button class="btn danger" style="padding:4px 12px;font-size:13px" onclick="setState('换绑')">确认换绑</button>
            <button class="btn ghost" style="padding:4px 12px;font-size:13px" onclick="document.getElementById('confirm-rebind').style.display='none';document.getElementById('btn-rebind').style.display='inline-block'">算了</button>
          </div>
        </div>
      `}
    </div>`;
  }

  switch(s.state){
    case '完善度未满':
      return `${head}
        <div class="account-layout">
          <div class="account-left">
            ${completenessBar(60)}
            ${profileForm(false)}
          </div>
          <div class="account-right">
            ${phoneSection(false, false)}
          </div>
        </div>`;

    case '已满':
      return `${head}
        <div class="account-layout">
          <div class="account-left">
            ${completenessBar(100)}
            ${profileForm(true)}
          </div>
          <div class="account-right">
            ${phoneSection(false, false)}
          </div>
        </div>`;

    case '保存中':
      return `${head}
        <div class="pulse" style="margin-bottom:16px"><i></i></div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px">保存中…</div>
        <div class="account-layout">
          <div class="account-left">
            ${completenessBar(compPct)}
            ${profileForm(true)}
          </div>
          <div class="account-right">
            ${phoneSection(false, false)}
          </div>
        </div>`;

    case '保存失败':
      return `${head}
        <div style="font-size:14px;color:var(--danger);margin-bottom:16px">保存失败，请重试</div>
        <button class="btn" style="margin-bottom:16px" onclick="setState('保存中')">重试</button>
        <div class="account-layout">
          <div class="account-left">
            ${completenessBar(compPct)}
            ${profileForm(true)}
          </div>
          <div class="account-right">
            ${phoneSection(false, false)}
          </div>
        </div>`;

    case '换绑':
      return `${head}
        <div class="account-layout">
          <div class="account-left">
            ${completenessBar(compPct)}
            ${profileForm(true)}
          </div>
          <div class="account-right">
            ${phoneSection(true, false)}
          </div>
        </div>`;

    case '换绑验证码错':
      return `${head}
        <div class="account-layout">
          <div class="account-left">
            ${completenessBar(compPct)}
            ${profileForm(true)}
          </div>
          <div class="account-right">
            ${phoneSection(true, true)}
          </div>
        </div>`;

    case '加载':
      return `${head}
        <div style="padding:60px 0;text-align:center">
          <div class="pulse" style="max-width:300px;margin:0 auto 16px"><i></i></div>
          <p style="color:var(--text-muted)">加载资料…</p>
        </div>`;

    case '加载失败':
      return `${head}
        <div style="padding:60px 0;text-align:center">
          <p style="color:var(--text-muted);margin-bottom:16px;font-size:16px">没拉到资料，请稍后重试</p>
          <button class="btn" onclick="setState('已满')">重试</button>
        </div>`;

    default:
      return fallback(s);
  }
}

// ===== 选题库（六态） =====
function renderTopics(s){
  function topicList(highlightFirst){
    const items = DEMO.topics.map((t, i) => {
      const hl = (highlightFirst && i === 0) ? ' highlight' : '';
      const tagHTML = t.tag === '原问答已删除' ? ` <span class="topic-tag-deleted">原问答已删除</span>` : '';
      return `<div class="topic-item${hl}">
        <span class="topic-title">${t.title}${tagHTML}</span>
        <span class="topic-from">${t.from}</span>
        <button class="btn ghost" style="padding:4px 12px;font-size:13px" onclick="setPage('create')">进创作</button>
      </div>`;
    }).join('');
    return `<div class="card">${items}</div>`;
  }

  switch(s.state){
    case '空':
      return `<div style="text-align:center;padding:60px 0">
        <p style="color:var(--text-muted);margin-bottom:24px;font-size:16px">还没有选题</p>
        <div style="display:flex;gap:12px;justify-content:center">
          <button class="btn" onclick="setPage('account-positioning')">去定位加高频问答</button>
          <button class="btn ghost" onclick="setPage('analyze')">去拆一条对标</button>
        </div>
      </div>`;

    case '加载':
      return `<div style="padding:60px 0;text-align:center">
        <div class="pulse" style="max-width:300px;margin:0 auto 16px"><i></i></div>
        <p style="color:var(--text-muted)">加载选题库…</p>
      </div>`;

    case '失败':
      return `<div style="padding:60px 0;text-align:center">
        <p style="color:var(--text-muted);margin-bottom:16px;font-size:16px">没拉到选题，请稍后重试</p>
        <button class="btn" onclick="setState('有选题')">重试</button>
      </div>`;

    case '有选题':
      return topicList(false);

    case '刚从FAQ生成':
      return topicList(true);

    case '含原问答已删除':
      return topicList(false);

    default:
      return fallback(s);
  }
}

// ===== 注册 =====
register('landing', ['default'], renderLanding);
register('login', ['填手机','倒计时','验证码错','开通引导'], renderLogin);
register('recharge', ['默认说明'], renderRecharge);
register('workbench', ['刚开通引导','已校准空库','使用中','加载','失败','额度用尽'], renderWorkbench);
register('calibrate', ['步骤1','步骤2','步骤3','进行中','失败','完成确认'], renderCalibrate);
register('account-positioning', ['未校准','档案在FAQ空','有FAQ','保存中','保存失败'], renderPositioning);
register('account-profile', ['完善度未满','已满','保存中','保存失败','换绑','换绑验证码错','加载','加载失败'], renderProfile);
register('topics', ['空','加载','失败','有选题','刚从FAQ生成','含原问答已删除'], renderTopics);
render();
</script>
</body>
</html>
