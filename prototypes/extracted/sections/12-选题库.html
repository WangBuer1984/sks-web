<sc-if value="{{ isTopics }}" hint-placeholder-val="{{ false }}">

            <div style="display: flex; gap: 10px; justify-content: center;">
              <button sc-camel-on-click="{{ goBench }}" style="border: none; background: #8a5a2b; color: #fff; border-radius: 8px; padding: 12px 24px; font-size: 13.5px; cursor: pointer;" style-hover="background: #6e4620;">去拆一个对标账号</button>
              <button sc-camel-on-click="{{ goPos }}" style="border: 1px solid #8a5a2b; color: #8a5a2b; background: none; border-radius: 8px; padding: 12px 24px; font-size: 13.5px; cursor: pointer;" style-hover="background: #f7f3ea;">先完成定位校准</button>

              <span style="font-size: 11px; font-weight: 700; color: {{ t.tagColor }}; border: 1px solid {{ t.tagBorder }}; background: {{ t.tagBg }}; padding: 3px 8px; border-radius: 4px; white-space: nowrap;">{{ t.tag }}</span>
